# HoverNet authoritative server configuration (HoverNetAuthServer --config this-file).
# One option per line: "name value", or just "name" for a switch. These are the command line options without the dashes;
# anything on the command line overrides this file. '#' starts a comment.

# Many races, hosted by players through the lobby. Remove this line to serve one fixed race (set track, players and laps below).
lobby

# Network. The server listens on the loopback address unless you say otherwise: until the encrypted session exists, put it behind
# TLS termination or keep it on a trusted network.
port 9610
bind 127.0.0.1
max-connections 256

# Tracks players may host (lobby mode), by name. Default: the seven official tracks.
# tracks ClassicH,Metro Spiral,Steeplechase,Switchback,The Alley2,The River,Tidal Causeway

# Each finished race is saved as a verifiable replay in this directory (create it first).
# replay-dir /var/lib/hovernet/replays

# Spectators see races this many milliseconds behind the drivers.
spectator-delay-ms 10000

# Moderation: a directory holding moderators.txt ("name secret" per line, readable only by the server user) and audit.log, and the
# loopback port of the moderators' console (use HoverNetModTool).
# moderation-dir /var/lib/hovernet/moderation
# admin-port 9611

# Monitoring: loopback port serving /health and /metrics, and a directory for crash reports.
# status-port 9612
# crash-dir /var/lib/hovernet/crashes

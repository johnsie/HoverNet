# Community tracks for the web client: https://hovernet.outiva.com/community-tracks/<shard>/<asset>.trk.gz
# Install as /etc/apache2/conf-available/hovernet-community-tracks.conf, then "a2enconf hovernet-community-tracks" and reload Apache
# (scripts/deploy-web-community-tracks.sh does all of it, and fills the folder with scripts/sync-web-community-tracks.sh).
# A browser cannot fetch the tracks from GitHub's releases (they redirect to another host and send no CORS header), so they are served from here,
# next to the web releases (not inside one: a new web build must not lose them). The files are plain gzip, named by their hash, so they never change.
Alias /community-tracks /var/www/hovernet.outiva.com/community-tracks
<Directory /var/www/hovernet.outiva.com/community-tracks>
    Options -Indexes
    AllowOverride None
    Require all granted
    <IfModule mod_mime.c>
        # Served as the bytes they are, not as "Content-Encoding: gzip": the browser would unpack them and the game would then fail to.
        RemoveEncoding .gz
        RemoveType .gz
        ForceType application/octet-stream
    </IfModule>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

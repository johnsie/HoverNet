# The browser track editor: https://hovernet.outiva.com/editor/ (docs/roadmap-track-editor.md). Install as /etc/apache2/conf-available/hovernet-editor.conf and
# "a2enconf hovernet-editor" (packaging/web/deploy-editor.sh does it, and tests the Apache configuration before reloading). Like the community-tracks and market
# snippets it is global, so the site's own file is not edited. It sits beside the game's releases (not inside one) so a new game release cannot remove it.
Alias /editor /var/www/hovernet.outiva.com/editor
<Directory /var/www/hovernet.outiva.com/editor>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    <IfModule mod_mime.c>
        AddType application/wasm .wasm
        AddType application/javascript .js
    </IfModule>
    <IfModule mod_headers.c>
        <FilesMatch "\.(html|js|wasm)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>
</Directory>

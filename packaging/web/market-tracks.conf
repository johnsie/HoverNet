# The Track Market (docs/adr/0004-track-marketplace.md): the submission service and the published track files.
# Install as /etc/apache2/conf-available/hovernet-market.conf and "a2enconf hovernet-market" (packaging/web/install-market.sh does it, and checks the
# configuration before reloading). Like community-tracks.conf this is a global snippet: the hovernet.outiva.com site inherits it, so the site's own
# configuration file is not edited.
ProxyPass /market/ http://127.0.0.1:9603/market/ connectiontimeout=3 timeout=120
ProxyPassReverse /market/ http://127.0.0.1:9603/market/

# The published tracks: plain gzip files named by their hash (immutable), written by the service.
Alias /market-tracks /var/www/hovernet.outiva.com/market-tracks
<Directory /var/www/hovernet.outiva.com/market-tracks>
    Options -Indexes
    AllowOverride None
    Require all granted
    <IfModule mod_mime.c>
        RemoveEncoding .gz
        RemoveType .gz
        ForceType application/octet-stream
    </IfModule>
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
    # the catalogue changes, so it is not cached for long
    <Files "catalogue.tsv">
        ForceType text/tab-separated-values
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=60"
        </IfModule>
    </Files>
</Directory>

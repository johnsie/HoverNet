<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <title>HoverNet</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #080c14; color: #e8eef8; font: 16px system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    #status { padding: .55rem 1rem; color: #b7c6da; }
    #status.error { color: #ff9b9b; }
    #canvas { display: block; width: 100%; height: 100%; min-height: 0; outline: none; object-fit: contain; }
    body.running #status { display: none; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Loading HoverNet…</div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var statusNode = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      setStatus: function(text) {
        statusNode.textContent = text || 'Starting HoverNet…';
        if (text && /error|failed/i.test(text)) statusNode.classList.add('error');
      },
      onRuntimeInitialized: function() {
        document.body.classList.add('running');
        this.canvas.focus();
      },
      onAbort: function(reason) {
        statusNode.textContent = 'HoverNet could not start: ' + reason;
        statusNode.classList.add('error');
      }
    };
    Module.canvas.addEventListener('pointerdown', function() { Module.canvas.focus(); });
  </script>
  {{{ SCRIPT }}}
</body>
</html>

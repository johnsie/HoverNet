# Install as /etc/apache2/sites-available/hovernet.outiva.com.conf and enable.
# Public TLS terminates at HAProxy; this certificate is for the HTTPS backend.
<VirtualHost *:80>
    ServerName hovernet.outiva.com
    Redirect permanent / https://hovernet.outiva.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName hovernet.outiva.com
    DocumentRoot /var/www/hovernet.outiva.com/current

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/hovernet-origin.crt
    SSLCertificateKeyFile /etc/ssl/private/hovernet-origin.key

    ProxyRequests Off
    ProxyPass /race/ ws://127.0.0.1:9601/race/ retry=0 timeout=300
    ProxyPassReverse /race/ ws://127.0.0.1:9601/race/

    # Authoritative HoverNet lobby (the service binds only to localhost and
    # validates the browser Origin before accepting the WebSocket upgrade).
    ProxyPass /auth/ ws://127.0.0.1:9610/auth/ retry=0 timeout=300
    ProxyPassReverse /auth/ ws://127.0.0.1:9610/auth/

    # The community tracks the web client downloads are served by packaging/web/community-tracks.conf (a conf-available snippet, enabled with a2enconf).

    <Directory /var/www/hovernet.outiva.com/current>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    <IfModule mod_mime.c>
        AddType application/wasm .wasm
        AddType application/javascript .js
        AddType application/octet-stream .data
    </IfModule>
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        # Framing is allowed only by the games console (play.html on outiva.com)
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Embedder-Policy "require-corp"
        Header always set Cross-Origin-Resource-Policy "same-site"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://accounts.outiva.com https://github.com https://*.githubusercontent.com wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors https://outiva.com"
        <FilesMatch "\.(js|wasm|data)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType application/wasm "access plus 0 seconds"
        ExpiresByType application/javascript "access plus 0 seconds"
        ExpiresByType application/octet-stream "access plus 0 seconds"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/hovernet.outiva.com-error.log
    CustomLog ${APACHE_LOG_DIR}/hovernet.outiva.com-access.log combined
</VirtualHost>

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - build
  - package
  - deploy

variables:
  GIT_DEPTH: "20"
  LINUX_RUNNER_TAG: "race-server"
  WINDOWS_RUNNER_TAG: "windows"
  SERVER_RUNNER_TAG: "race-server"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

default:
  interruptible: true

lint:gitlab-ci:
  stage: validate
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - test -f .gitlab-ci.yml
    - test -f packaging/debian/hovernet-raceserver.service

build:raceserver:linux:
  stage: build
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - mkdir -p build/raceserver
    - g++ -std=c++14 -O2 -pthread -I NetTarget/RaceServer -I NetTarget/RaceServer/NetworkInterface -I NetTarget/RaceServer/GameSimulation -I NetTarget/RaceServer/RaceManager -I NetTarget/RaceServer/Config -I NetTarget/RaceServer/Logging $(find NetTarget/RaceServer -path '*/build/*' -prune -o -name '*.cpp' -print) -o build/raceserver/RaceServer
    - test -x build/raceserver/RaceServer
  artifacts:
    expire_in: 7 days
    paths:
      - build/raceserver/RaceServer

build:game:linux:
  stage: build
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
    - cmake --build build/linux --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
    - ctest --test-dir build/linux --output-on-failure

package:raceserver:deb:
  stage: package
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - job: build:raceserver:linux
      artifacts: true
  script:
    - chmod +x packaging/debian/build-raceserver-deb.sh
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; packaging/debian/build-raceserver-deb.sh "${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}" build/raceserver/RaceServer
  artifacts:
    name: "hovernet-raceserver-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*.deb

build:game:windows:
  stage: build
  tags: ["$WINDOWS_RUNNER_TAG"]
  script:
    - '& msbuild NetTarget/Game2/Game2.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal'
  artifacts:
    expire_in: 7 days
    paths:
      - Release/
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:game:windows:
  stage: package
  tags: ["$WINDOWS_RUNNER_TAG"]
  needs:
    - job: build:game:windows
      artifacts: true
  script:
    - '$env:HOVERNET_VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.0-$env:CI_COMMIT_SHORT_SHA" }'
    - '$env:HOVERNET_RELEASE_DIR = (Resolve-Path Release).Path'
    - '& iscc packaging/windows/HoverNet.iss'
  artifacts:
    name: "hovernet-game-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*-win32-setup.exe
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:raceserver:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package:raceserver:deb
      artifacts: true
  resource_group: production-race-server
  environment:
    name: production
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-deploy dist/hovernet-raceserver_*.deb
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: false
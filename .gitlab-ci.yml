workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - web
  - build
  - package
  - deploy

variables:
  GIT_DEPTH: "20"
  LINUX_RUNNER_TAG: "race-server"
  WEB_RUNNER_TAG: "race-server"
  WEB_EMSDK_VERSION: "3.1.74"
  SERVER_RUNNER_TAG: "race-server"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

default:
  interruptible: true

# Kept so old scheduled pipelines on the project do nothing (the nightly sanitizer run now lives in GitHub Actions).
.no_schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never

lint:gitlab-ci:
  stage: validate
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - test -f .gitlab-ci.yml
    - test -f packaging/debian/hovernet-raceserver.service
    - test -x packaging/debian/build-game-deb.sh
    - test -x packaging/debian/hovernet-game
    - test -f NetTarget/CommunityTracks.tsv
    - test -f CHANGELOG.md
    - test -f THIRD_PARTY_NOTICES.md
    - test -x scripts/make-release-checksums.sh
    - test -x scripts/generate-community-manifest.sh
    - test -x scripts/package-community-tracks.sh
    - test -f packaging/web/shell.html
    - test -f packaging/web/web-pre.js
    - test -f packaging/web/websocket_gateway.py
    - test -f packaging/web/hovernet-websocket-gateway.service
    - test -x packaging/web/hovernet-web-deploy

build:raceserver:linux:
  stage: build
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  needs: []
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - mkdir -p build/raceserver
    - g++ -std=c++14 -O2 -pthread -I NetTarget/RaceServer -I NetTarget/RaceServer/NetworkInterface -I NetTarget/RaceServer/GameSimulation -I NetTarget/RaceServer/RaceManager -I NetTarget/RaceServer/Config -I NetTarget/RaceServer/Logging $(find NetTarget/RaceServer -path '*/build/*' -prune -o -name '*.cpp' -print) -o build/raceserver/RaceServer
    - test -x build/raceserver/RaceServer
    # The server's own protocol, lifecycle and fuzz tests (the client and the packages are built and tested in GitHub Actions).
    - cmake -S . -B build/servertests -DCMAKE_BUILD_TYPE=Release
    - cmake --build build/servertests --target RaceServer HoverNetRaceServerClientSmoke HoverNetRaceServerLifecycleSmoke --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
    - ctest --test-dir build/servertests --output-on-failure -R 'HoverNetRaceServer(ClientSmoke|ProtocolStrictSmoke|LifecycleSmoke|ProtocolFuzz)'
  artifacts:
    expire_in: 7 days
    paths:
      - build/raceserver/RaceServer

build:game:web:
  stage: web
  needs: []
  tags: ["$WEB_RUNNER_TAG"]
  script:
    - |
      EMSDK_BOOTSTRAP=0
      if [ -z "${EMSDK:-}" ]; then
        EMSDK="${HOME}/.cache/emsdk/${WEB_EMSDK_VERSION}"
        export EMSDK
        EMSDK_BOOTSTRAP=1
      fi
      EMSDK_MARKER="$EMSDK/.hovernet-installed-${WEB_EMSDK_VERSION}"
      if [ ! -x "$EMSDK/upstream/emscripten/emcmake" ] || { [ "$EMSDK_BOOTSTRAP" -eq 1 ] && [ ! -f "$EMSDK_MARKER" ]; }; then
        if [ "$EMSDK_BOOTSTRAP" -ne 1 ]; then
          echo "Configured EMSDK does not contain emcmake: $EMSDK" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$EMSDK")"
        (
          flock -x 9
          if [ ! -x "$EMSDK/upstream/emscripten/emcmake" ] || [ ! -f "$EMSDK_MARKER" ]; then
            INSTALLING="${EMSDK}.installing"
            rm -rf "$INSTALLING" "$EMSDK"
            git clone --depth 1 --branch "$WEB_EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$INSTALLING"
            mv "$INSTALLING" "$EMSDK"
            "$EMSDK/emsdk" install "$WEB_EMSDK_VERSION"
            "$EMSDK/emsdk" activate "$WEB_EMSDK_VERSION"
            touch "$EMSDK_MARKER"
          fi
        ) 9>"${EMSDK}.install.lock"
      fi
      . "$EMSDK/emsdk_env.sh"
      command -v emcc
      emcc --version | grep -F "$WEB_EMSDK_VERSION"
    # Incremental build: keep the CMake tree on the runner between pipelines so only
    # changed sources recompile. The lock serialises pipelines sharing the tree; a
    # configure failure (moved checkout, changed toolchain) discards it and starts clean.
    - |
      WEB_BUILD_DIR="${HOME}/.cache/hovernet-web-build"
      mkdir -p "$WEB_BUILD_DIR"
      (
        flock -x 8
        if ! emcmake cmake -S . -B "$WEB_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF; then
          rm -rf "$WEB_BUILD_DIR"; mkdir -p "$WEB_BUILD_DIR"
          emcmake cmake -S . -B "$WEB_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        fi
        cmake --build "$WEB_BUILD_DIR" --target HoverNetGame2Player --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        # Cross-platform determinism: the WebAssembly build must replay the scripted races to the same
        # hashes as the committed (native) golden values. See docs/determinism.md.
        cmake --build "$WEB_BUILD_DIR" --target HoverNetDeterminismRun --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        scripts/test-determinism.sh "node $WEB_BUILD_DIR/HoverNetDeterminismRun.js"
        mkdir -p dist/web
        cp "$WEB_BUILD_DIR/HoverNet.html" dist/web/index.html
        cp "$WEB_BUILD_DIR/HoverNet.js" "$WEB_BUILD_DIR/HoverNet.wasm" "$WEB_BUILD_DIR/HoverNet.data" dist/web/
      ) 8>"${WEB_BUILD_DIR}.lock"
    - tar -czf "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" -C dist/web index.html HoverNet.js HoverNet.wasm HoverNet.data
    - 'if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then sudo /usr/local/sbin/hovernet-web-deploy "dist/hovernet-web-${CI_COMMIT_SHORT_SHA}.tar.gz"; fi'
  artifacts:
    name: "hovernet-web-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/hovernet-web-*.tar.gz
  rules:
    - !reference [.no_schedule, rules]
    # Docs-only changes cannot alter the web artifact, so skip the rebuild.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &web_inputs
        - NetTarget/**/*
        - packaging/web/**/*
        - CMakeLists.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

test:web:smoke:
  stage: package
  needs:
    - job: build:game:web
      artifacts: true
  tags: ["$WEB_RUNNER_TAG"]
  # Drives the built client in headless Chrome (menus, a local race, pause and resume). Skips itself
  # when the runner has no Chrome, and never blocks the deploy.
  script:
    - mkdir -p dist/web-unpacked dist/web-smoke
    - tar -xzf "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" -C dist/web-unpacked
    # Exit 77 means "no Chrome on this runner": pass with a note instead of failing (the shell executor turns any
    # non-zero exit into a job failure). Any other non-zero exit is a real failure.
    - scripts/test-web-client.sh dist/web-unpacked dist/web-smoke || rc=$?; if [ "${rc:-0}" = "77" ]; then echo "web smoke test skipped (no Chrome on this runner)"; elif [ "${rc:-0}" != "0" ]; then exit "$rc"; fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/web-smoke/
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *web_inputs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

check:web:deployed:
  stage: deploy
  needs:
    # Tags deploy in their own job; on the default branch the web build job deploys itself.
    - job: deploy:web
      optional: true
    - job: build:game:web
      optional: true
  tags: ["$SERVER_RUNNER_TAG"]
  # Post-deploy checks against the Apache on the runner host (the runner cannot reach the public name):
  # headers, MIME types, WebSocket gateway.
  script:
    - HOVERNET_CHECK_LOCAL=1 scripts/check-web-deploy.sh https://hovernet.outiva.com
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

package:raceserver:deb:
  stage: package
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - job: build:raceserver:linux
      artifacts: true
  script:
    - chmod +x packaging/debian/build-raceserver-deb.sh
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; packaging/debian/build-raceserver-deb.sh "${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}" build/raceserver/RaceServer
  artifacts:
    name: "hovernet-raceserver-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*.deb

deploy:raceserver:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package:raceserver:deb
      artifacts: true
  resource_group: production-race-server
  environment:
    name: production
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-deploy dist/hovernet-raceserver_*.deb
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

deploy:web:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: build:game:web
      artifacts: true
  resource_group: production-web
  environment:
    name: production-web
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-web-deploy "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz"
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

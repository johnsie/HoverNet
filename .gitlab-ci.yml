workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - web
  - build
  - package
  - publish
  - deploy

variables:
  GIT_DEPTH: "20"
  LINUX_RUNNER_TAG: "race-server"
  WEB_RUNNER_TAG: "race-server"
  WEB_EMSDK_VERSION: "3.1.74"
  WINDOWS_RUNNER_TAG: "windows"
  SERVER_RUNNER_TAG: "race-server"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

default:
  interruptible: true

# Scheduled (nightly) pipelines run only the sanitizer job; everything else skips them.
.no_schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never

lint:gitlab-ci:
  stage: validate
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - test -f .gitlab-ci.yml
    - test -f packaging/debian/hovernet-raceserver.service
    - test -x packaging/debian/build-game-deb.sh
    - test -x packaging/debian/hovernet-game
    - test -f NetTarget/CommunityTracks.tsv
    - test -f CHANGELOG.md
    - test -f THIRD_PARTY_NOTICES.md
    - test -x scripts/make-release-checksums.sh
    - test -x scripts/generate-community-manifest.sh
    - test -x scripts/package-community-tracks.sh
    - test -f packaging/web/shell.html
    - test -f packaging/web/web-pre.js
    - test -f packaging/web/websocket_gateway.py
    - test -f packaging/web/hovernet-websocket-gateway.service
    - test -x packaging/web/hovernet-web-deploy

build:raceserver:linux:
  stage: build
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  needs: []
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - mkdir -p build/raceserver
    - g++ -std=c++14 -O2 -pthread -I NetTarget/RaceServer -I NetTarget/RaceServer/NetworkInterface -I NetTarget/RaceServer/GameSimulation -I NetTarget/RaceServer/RaceManager -I NetTarget/RaceServer/Config -I NetTarget/RaceServer/Logging $(find NetTarget/RaceServer -path '*/build/*' -prune -o -name '*.cpp' -print) -o build/raceserver/RaceServer
    - test -x build/raceserver/RaceServer
  artifacts:
    expire_in: 7 days
    paths:
      - build/raceserver/RaceServer

build:game:linux:
  stage: build
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  needs: []
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release
    - cmake --build build/linux --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
    - ctest --test-dir build/linux --output-on-failure
  artifacts:
    expire_in: 7 days
    paths:
      - build/linux/HoverNetGame2Player
      - build/linux/ObjFac1.so

build:game:web:
  stage: web
  needs: []
  tags: ["$WEB_RUNNER_TAG"]
  script:
    - |
      EMSDK_BOOTSTRAP=0
      if [ -z "${EMSDK:-}" ]; then
        EMSDK="${HOME}/.cache/emsdk/${WEB_EMSDK_VERSION}"
        export EMSDK
        EMSDK_BOOTSTRAP=1
      fi
      EMSDK_MARKER="$EMSDK/.hovernet-installed-${WEB_EMSDK_VERSION}"
      if [ ! -x "$EMSDK/upstream/emscripten/emcmake" ] || { [ "$EMSDK_BOOTSTRAP" -eq 1 ] && [ ! -f "$EMSDK_MARKER" ]; }; then
        if [ "$EMSDK_BOOTSTRAP" -ne 1 ]; then
          echo "Configured EMSDK does not contain emcmake: $EMSDK" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$EMSDK")"
        (
          flock -x 9
          if [ ! -x "$EMSDK/upstream/emscripten/emcmake" ] || [ ! -f "$EMSDK_MARKER" ]; then
            INSTALLING="${EMSDK}.installing"
            rm -rf "$INSTALLING" "$EMSDK"
            git clone --depth 1 --branch "$WEB_EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$INSTALLING"
            mv "$INSTALLING" "$EMSDK"
            "$EMSDK/emsdk" install "$WEB_EMSDK_VERSION"
            "$EMSDK/emsdk" activate "$WEB_EMSDK_VERSION"
            touch "$EMSDK_MARKER"
          fi
        ) 9>"${EMSDK}.install.lock"
      fi
      . "$EMSDK/emsdk_env.sh"
      command -v emcc
      emcc --version | grep -F "$WEB_EMSDK_VERSION"
    # Incremental build: keep the CMake tree on the runner between pipelines so only
    # changed sources recompile. The lock serialises pipelines sharing the tree; a
    # configure failure (moved checkout, changed toolchain) discards it and starts clean.
    - |
      WEB_BUILD_DIR="${HOME}/.cache/hovernet-web-build"
      mkdir -p "$WEB_BUILD_DIR"
      (
        flock -x 8
        if ! emcmake cmake -S . -B "$WEB_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF; then
          rm -rf "$WEB_BUILD_DIR"; mkdir -p "$WEB_BUILD_DIR"
          emcmake cmake -S . -B "$WEB_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        fi
        cmake --build "$WEB_BUILD_DIR" --target HoverNetGame2Player --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        # Cross-platform determinism: the WebAssembly build must replay the scripted races to the same
        # hashes as the committed (native) golden values. See docs/determinism.md.
        cmake --build "$WEB_BUILD_DIR" --target HoverNetDeterminismRun --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        scripts/test-determinism.sh "node $WEB_BUILD_DIR/HoverNetDeterminismRun.js"
        mkdir -p dist/web
        cp "$WEB_BUILD_DIR/HoverNet.html" dist/web/index.html
        cp "$WEB_BUILD_DIR/HoverNet.js" "$WEB_BUILD_DIR/HoverNet.wasm" "$WEB_BUILD_DIR/HoverNet.data" dist/web/
      ) 8>"${WEB_BUILD_DIR}.lock"
    - tar -czf "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" -C dist/web index.html HoverNet.js HoverNet.wasm HoverNet.data
    - 'if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then sudo /usr/local/sbin/hovernet-web-deploy "dist/hovernet-web-${CI_COMMIT_SHORT_SHA}.tar.gz"; fi'
  artifacts:
    name: "hovernet-web-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/hovernet-web-*.tar.gz
  rules:
    - !reference [.no_schedule, rules]
    # Docs-only changes cannot alter the web artifact, so skip the rebuild.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &web_inputs
        - NetTarget/**/*
        - packaging/web/**/*
        - CMakeLists.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

test:web:smoke:
  stage: package
  needs:
    - job: build:game:web
      artifacts: true
  tags: ["$WEB_RUNNER_TAG"]
  # Drives the built client in headless Chrome (menus, a local race, pause and resume). Skips itself
  # (exit 77) when the runner has no Chrome, and never blocks the deploy.
  allow_failure:
    exit_codes: 77
  script:
    - mkdir -p dist/web-unpacked
    - tar -xzf "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" -C dist/web-unpacked
    - scripts/test-web-client.sh dist/web-unpacked dist/web-smoke
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/web-smoke/
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *web_inputs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

check:web:deployed:
  stage: deploy
  needs:
    - job: deploy:web
  tags: ["$SERVER_RUNNER_TAG"]
  # Post-deploy checks from the runner against the live site: headers, MIME types, WebSocket gateway.
  script:
    - scripts/check-web-deploy.sh https://hovernet.outiva.com
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

build:game:linux:sanitizers:
  stage: build
  needs: []
  tags: ["$LINUX_RUNNER_TAG"]
  variables:
    ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
    UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
  script:
    - cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHOVERNET_WARNINGS=ON -DHOVERNET_SANITIZE=ON
    - cmake --build build/sanitize --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" > build/sanitize/build.log 2>&1 || { tail -n 60 build/sanitize/build.log; exit 1; }
    - 'echo "compiler warnings: $(grep -c "warning:" build/sanitize/build.log || true)"'
    - ctest --test-dir build/sanitize --output-on-failure
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/sanitize/build.log
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

package:raceserver:deb:
  stage: package
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - job: build:raceserver:linux
      artifacts: true
  script:
    - chmod +x packaging/debian/build-raceserver-deb.sh
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; packaging/debian/build-raceserver-deb.sh "${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}" build/raceserver/RaceServer
  artifacts:
    name: "hovernet-raceserver-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*.deb

package:game:deb:
  stage: package
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - job: build:game:linux
      artifacts: true
  script:
    - chmod +x packaging/debian/build-game-deb.sh
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; packaging/debian/build-game-deb.sh "${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}" build/linux/HoverNetGame2Player build/linux/ObjFac1.so
  artifacts:
    name: "hovernet-game-linux-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/hovernet-game_*.deb

build:game:windows:shared-x64:
  stage: build
  needs: []
  tags: ["$WINDOWS_RUNNER_TAG"]
  script:
    - '$vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } elseif ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } elseif (Test-Path "C:\vcpkg\vcpkg.exe") { "C:\vcpkg" } else { throw "vcpkg was not found; set VCPKG_ROOT on the Windows runner" }; $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"; & $vcpkg install "sdl2:x64-windows"; if ($LASTEXITCODE -ne 0) { throw "vcpkg failed to install x64 SDL2" }; $toolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"; $cmakeOnPath = Get-Command cmake.exe -ErrorAction SilentlyContinue; $cmakeCandidates = @("C:\Program Files\CMake\bin\cmake.exe", "C:\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe", "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe", "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"); $cmake = if ($cmakeOnPath) { $cmakeOnPath.Source } else { $cmakeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }; if (-not $cmake) { $cmake = (& $vcpkg fetch cmake | Select-Object -Last 1).Trim() }; if (-not (Test-Path $cmake)) { throw "CMake was not found on PATH, in Visual Studio Build Tools, or through vcpkg fetch cmake" }; & $cmake -S . -B build/windows-shared -A x64 -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows -DBUILD_TESTING=OFF; if ($LASTEXITCODE -ne 0) { throw "Shared x64 client configure failed" }; & $cmake --build build/windows-shared --target HoverNetGame2Player RaceServer --config Release --parallel 2; if ($LASTEXITCODE -ne 0) { throw "Shared x64 client or RaceServer build failed" }'
    - '$sdl = Join-Path $vcpkgRoot "installed\x64-windows\bin\SDL2.dll"; $required = @("build\windows-shared\Release\HoverNet.exe", "build\windows-shared\Release\ObjFac1.dll", "build\windows-shared\Release\RaceServer.exe", $sdl); $missing = $required | Where-Object { -not (Test-Path $_) }; if ($missing) { throw "Missing shared x64 runtime files: $($missing -join ", ")" }; Copy-Item $sdl "build\windows-shared\Release\SDL2.dll" -Force'
    - '$env:SDL_VIDEODRIVER = "dummy"; $env:SDL_AUDIODRIVER = "dummy"; $client = "build\windows-shared\Release\HoverNet.exe"; $scenarios = @("--frames 1", "--settings-screen --frames 2", "--controls-reference --frames 2", "--pause-menu --frames 2", "--results-screen --frames 2", "--onboarding --frames 2"); foreach ($scenario in $scenarios) { $arguments = $scenario.Split(" "); $process = Start-Process -FilePath $client -ArgumentList $arguments -Wait -PassThru; if ($process.ExitCode -ne 0) { throw "Shared x64 client smoke scenario failed: $scenario" } }'
    - '$server = Start-Process -FilePath "build\windows-shared\Release\RaceServer.exe" -ArgumentList "19879", "build\windows-shared\shared-online-race-smoke.log", "--require-protocol-2" -PassThru; try { Start-Sleep -Seconds 1; $hostClient = Start-Process -FilePath "build\windows-shared\Release\HoverNet.exe" -ArgumentList "--lobby", "127.0.0.1", "19879", "--online-race-host-smoke", "--frames", "300" -PassThru; Start-Sleep -Seconds 1; $joinClient = Start-Process -FilePath "build\windows-shared\Release\HoverNet.exe" -ArgumentList "--lobby", "127.0.0.1", "19879", "--online-race-join-smoke", "--frames", "300" -Wait -PassThru; $hostClient.WaitForExit(); if ($hostClient.ExitCode -ne 0 -or $joinClient.ExitCode -ne 0) { throw "Shared x64 two-client online race acceptance failed" } } finally { if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force } }'
    - '& "scripts\test-windows-client.ps1" -Exe "build\windows-shared\Release\HoverNet.exe" -DataDir (Get-Location).Path; if ($LASTEXITCODE -ne 0) { throw "Windows client acceptance failed" }'
  artifacts:
    name: "hovernet-shared-windows-x64-${CI_COMMIT_REF_SLUG}"
    expire_in: 7 days
    paths:
      - build/windows-shared/Release/HoverNet.exe
      - build/windows-shared/Release/ObjFac1.dll
      - build/windows-shared/Release/SDL2.dll
      - build/windows-shared/Release/RaceServer.exe
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:game:windows:shared-x64:
  stage: package
  tags: ["$WINDOWS_RUNNER_TAG"]
  needs:
    - job: build:game:windows:shared-x64
      artifacts: true
  script:
    - '$release = "build\windows-shared\Release"; New-Item -ItemType Directory -Force "$release\NetTarget\Tracks", "$release\NetTarget\LinuxClient\assets" | Out-Null; Copy-Item "NetTarget\ObjFac1.dat" "$release\NetTarget\ObjFac1.dat" -Force; Copy-Item "NetTarget\Tracks\*.trk" "$release\NetTarget\Tracks\" -Force; Copy-Item "NetTarget\CommunityTracks.tsv" "$release\NetTarget\CommunityTracks.tsv" -Force; Copy-Item "NetTarget\LinuxClient\assets\*.bmp" "$release\NetTarget\LinuxClient\assets\" -Force; Copy-Item "NetTarget\LinuxClient\assets\*.ttf" "$release\NetTarget\LinuxClient\assets\" -Force; Copy-Item "NetTarget\LinuxClient\assets\*-OFL.txt" "$release\NetTarget\LinuxClient\assets\" -Force'
    - '$vcRedist = "build\windows-shared\Release\vc_redist.x64.exe"; Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $vcRedist; $vcSignature = Get-AuthenticodeSignature $vcRedist; if ($vcSignature.Status -ne "Valid" -or $vcSignature.SignerCertificate.Subject -notmatch "Microsoft Corporation") { throw "Downloaded Visual C++ x64 Redistributable does not have a valid Microsoft signature" }'
    - '& "scripts\validate-windows-x64-package.ps1" -ReleaseDir "build\windows-shared\Release" -RequireVCRedist'
    - '$env:HOVERNET_VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG.TrimStart("v") } else { "0.0.0-$env:CI_COMMIT_SHORT_SHA" }; $env:HOVERNET_X64_RELEASE_DIR = (Resolve-Path "build\windows-shared\Release").Path; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"; if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }; & $iscc packaging/windows/HoverNet-x64.iss; if ($LASTEXITCODE -ne 0) { throw "Shared x64 Inno Setup packaging failed" }'
    - '$installer = Get-ChildItem "dist\*-windows-x64-setup.exe" | Select-Object -First 1; if (-not $installer) { throw "Shared x64 installer was not generated" }; $installDir = Join-Path $env:CI_PROJECT_DIR "build\windows-x64-install-smoke"; $install = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru; if ($install.ExitCode -ne 0) { throw "Shared x64 installer smoke failed with exit code $($install.ExitCode)" }; try { & "scripts\validate-windows-x64-package.ps1" -ReleaseDir $installDir; $env:SDL_VIDEODRIVER = "dummy"; $env:SDL_AUDIODRIVER = "dummy"; $sourceData = "NetTarget\ObjFac1.dat"; $hiddenSourceData = "$sourceData.package-smoke-hidden"; Move-Item $sourceData $hiddenSourceData; try { $installedScenarios = @("--frames 1", "--settings-screen --frames 2", "--controls-reference --frames 2", "--pause-menu --frames 2", "--results-screen --frames 2", "--onboarding --frames 2"); foreach ($scenario in $installedScenarios) { $installedClient = Start-Process -FilePath "$installDir\HoverNet.exe" -WorkingDirectory $installDir -ArgumentList ($scenario.Split(" ")) -Wait -PassThru; if ($installedClient.ExitCode -ne 0) { throw "Installed shared x64 client smoke failed: $scenario" } } $installedServer = Start-Process -FilePath "build\windows-shared\Release\RaceServer.exe" -ArgumentList "19881", "build\windows-shared\installed-online-race-smoke.log", "--require-protocol-2" -PassThru; try { Start-Sleep -Seconds 1; $installedHost = Start-Process -FilePath "$installDir\HoverNet.exe" -WorkingDirectory $installDir -ArgumentList "--lobby", "127.0.0.1", "19881", "--online-race-host-smoke", "--frames", "300" -PassThru; Start-Sleep -Seconds 1; $installedJoiner = Start-Process -FilePath "$installDir\HoverNet.exe" -WorkingDirectory $installDir -ArgumentList "--lobby", "127.0.0.1", "19881", "--online-race-join-smoke", "--frames", "300" -Wait -PassThru; $installedHost.WaitForExit(); if ($installedHost.ExitCode -ne 0 -or $installedJoiner.ExitCode -ne 0) { throw "Installed shared x64 two-client online race acceptance failed" } } finally { if (-not $installedServer.HasExited) { Stop-Process -Id $installedServer.Id -Force } } } finally { Move-Item $hiddenSourceData $sourceData } } finally { $uninstaller = Join-Path $installDir "unins000.exe"; if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait } }'
  artifacts:
    name: "hovernet-game-windows-x64-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*-windows-x64-setup.exe
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build:game:windows:
  stage: build
  needs: []
  tags: ["$WINDOWS_RUNNER_TAG"]
  script:
    - '$msbuild = "C:\BuildTools\MSBuild\Current\Bin\MSBuild.exe"; if (-not (Test-Path $msbuild)) { throw "MSBuild not found at $msbuild" }; & $msbuild NetTarget/ObjFac1/ObjFac1.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & $msbuild NetTarget/Game2/Game2.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal'
    - 'Copy-Item "C:\SDL2\lib\x86\SDL2.dll" "Release\SDL2.dll" -Force; Copy-Item "NetTarget\ObjFac1\ObjFac1.dat" "Release\ObjFac1.dat" -Force; New-Item -ItemType Directory -Force -Path "Release\tracks" | Out-Null; Copy-Item "NetTarget\Tracks\*.trk" "Release\tracks\" -Force; $required = @("Game2.exe", "ObjFac1.dll", "ObjFac1.dat", "VideoServices.dll", "Model.dll", "MainCharacter.dll", "tracks\ClassicH.trk"); foreach ($file in $required) { if (-not (Test-Path (Join-Path "Release" $file))) { throw "Missing Windows runtime file: $file" } }'
  artifacts:
    expire_in: 7 days
    paths:
      - Release/
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:game:windows:
  stage: package
  tags: ["$WINDOWS_RUNNER_TAG"]
  needs:
    - job: build:game:windows
      artifacts: true
  script:
    - '$env:HOVERNET_VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { "0.0.0-$env:CI_COMMIT_SHORT_SHA" }'
    - '$env:HOVERNET_RELEASE_DIR = (Resolve-Path Release).Path'
    - '$iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"; if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }; & $iscc packaging/windows/HoverNet.iss'
  artifacts:
    name: "hovernet-game-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*-win32-setup.exe
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build:raceserver:windows:
  stage: build
  needs: []
  tags: ["$WINDOWS_RUNNER_TAG"]
  script:
    - '$msbuild = "C:\BuildTools\MSBuild\Current\Bin\MSBuild.exe"; if (-not (Test-Path $msbuild)) { throw "MSBuild not found at $msbuild" }; & $msbuild NetTarget/RaceServer/RaceServer.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'if (-not (Test-Path "NetTarget\RaceServer\Release\RaceServer.exe")) { throw "Missing NetTarget\RaceServer\Release\RaceServer.exe" }'
  artifacts:
    expire_in: 7 days
    paths:
      - NetTarget/RaceServer/Release/RaceServer.exe
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:raceserver:windows:
  stage: package
  tags: ["$WINDOWS_RUNNER_TAG"]
  needs:
    - job: build:raceserver:windows
      artifacts: true
  script:
    - '$version = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG.TrimStart("v") } else { "0.0.0+$env:CI_COMMIT_SHORT_SHA" }'
    - 'New-Item -ItemType Directory -Force -Path dist, stage/raceserver | Out-Null'
    - 'Copy-Item "NetTarget\RaceServer\Release\RaceServer.exe" "stage\raceserver\RaceServer.exe" -Force'
    - 'Copy-Item "NetTarget\RaceServer\config.xml" "stage\raceserver\config.xml" -Force'
    - 'Copy-Item "NetTarget\CommunityTracks.tsv" "stage\raceserver\CommunityTracks.tsv" -Force'
    - "Compress-Archive -Path 'stage\\raceserver\\*' -DestinationPath \"dist\\hovernet-raceserver_${version}_win32.zip\" -Force"
  artifacts:
    name: "hovernet-raceserver-windows-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*.zip
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:github-release:
  stage: publish
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package:raceserver:deb
      artifacts: true
    - job: package:game:deb
      artifacts: true
    - job: package:game:windows
      artifacts: true
    - job: package:game:windows:shared-x64
      artifacts: true
    - job: package:raceserver:windows
      artifacts: true
  script:
    - test -n "$GH_TOKEN" || { echo "GH_TOKEN CI/CD variable is not set (Settings > CI/CD > Variables, masked+protected)"; exit 1; }
    - export GH_TOKEN
    - ls -la dist/
    - scripts/make-release-checksums.sh dist
    - |
      # A tag with a hyphen (v2.0.0-beta.1) is a pre-release: marked as one (so it never
      # becomes "latest") and starting with the beta notes. A stable tag starts with
      # docs/release-notes.md (which invites feedback via GitHub issues).
      prerelease=""
      case "$CI_COMMIT_TAG" in
        *-*) prerelease="--prerelease --notes-file docs/beta-release-notes.md";;
        *) prerelease="--notes-file docs/release-notes.md";;
      esac
      gh release create "$CI_COMMIT_TAG" $prerelease dist/SHA256SUMS dist/*.deb dist/*-win32-setup.exe dist/*-windows-x64-setup.exe dist/*.zip --repo johnsie/HoverNet --title "$CI_COMMIT_TAG" --notes "Automated release for $CI_COMMIT_TAG"
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

deploy:raceserver:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package:raceserver:deb
      artifacts: true
  resource_group: production-race-server
  environment:
    name: production
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-deploy dist/hovernet-raceserver_*.deb
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

deploy:web:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: build:game:web
      artifacts: true
  resource_group: production-web
  environment:
    name: production-web
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-web-deploy "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz"
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $HOVERNET_MAIN_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - web
  - build
  - package
  - deploy

variables:
  GIT_DEPTH: "20"
  LINUX_RUNNER_TAG: "race-server"
  WEB_RUNNER_TAG: "race-server"
  WEB_EMSDK_VERSION: "3.1.74"
  SERVER_RUNNER_TAG: "race-server"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  # This project's GitLab default branch is not `main`, so branch rules name the release branch explicitly.
  HOVERNET_MAIN_BRANCH: "main"

default:
  interruptible: true
  # Compile through ccache when the runner has it (the compiler launcher is read when CMake configures).
  before_script:
    - 'if command -v ccache >/dev/null 2>&1; then export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache; fi'

# Kept so old scheduled pipelines on the project do nothing (the nightly sanitizer run now lives in GitHub Actions).
.no_schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never

lint:gitlab-ci:
  stage: validate
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - test -f .gitlab-ci.yml
    - test -f packaging/debian/hovernet-raceserver.service
    - test -x packaging/debian/build-game-deb.sh
    - test -x packaging/debian/hovernet-game
    - test -f NetTarget/CommunityTracks.tsv
    - test -f CHANGELOG.md
    - test -f THIRD_PARTY_NOTICES.md
    - test -x scripts/make-release-checksums.sh
    - test -x scripts/generate-community-manifest.sh
    - test -x scripts/package-community-tracks.sh
    - test -f packaging/web/shell.html
    - test -f packaging/web/web-pre.js
    - test -f packaging/web/websocket_gateway.py
    - test -f packaging/web/hovernet-websocket-gateway.service
    - test -x packaging/web/hovernet-web-deploy
    - python3 -I scripts/test-web-account.py   # the optional Outiva sign-in service, against a stand-in Keycloak
    - python3 -I scripts/test-web-market.py    # the Track Market submission service (its rules, catalogue and HTTP layer; the real-tools part needs a build and is run by ctest)
    - scripts/test-web-deploy-order.sh   # the web deploy wrapper must refuse a build older than the live one
    - GIT_DEPTH=0 git fetch --unshallow --quiet 2>/dev/null || true; scripts/test-conffile-upgrade.sh || [ $? -eq 77 ]   # the server package must upgrade over an edited configuration without a question

build:raceserver:linux:
  stage: build
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  needs: []
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - |
      mkdir -p build/raceserver
      # The packaged server is built by this one g++ command; it runs in the background while the tests' CMake tree builds (the two used to run one after the other).
      g++ -std=c++14 -O2 -pthread -I NetTarget/RaceServer -I NetTarget/RaceServer/NetworkInterface -I NetTarget/RaceServer/GameSimulation -I NetTarget/RaceServer/RaceManager -I NetTarget/RaceServer/Config -I NetTarget/RaceServer/Logging $(find NetTarget/RaceServer -path '*/build/*' -prune -o -name '*.cpp' -print) -o build/raceserver/RaceServer &
      GPP_PID=$!
      # The server's own protocol, lifecycle and fuzz tests (the client and the packages are built and tested in GitHub Actions). The CMake tree is kept on the runner
      # between pipelines (as the web build's is), so only changed sources recompile; a configure failure discards it and starts clean.
      TEST_BUILD_DIR="${HOME}/.cache/hovernet-build/servertests"
      mkdir -p "$TEST_BUILD_DIR"
      (
        flock -x 8
        if ! cmake -S . -B "$TEST_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release; then
          rm -rf "$TEST_BUILD_DIR"; mkdir -p "$TEST_BUILD_DIR"
          cmake -S . -B "$TEST_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release
        fi
        cmake --build "$TEST_BUILD_DIR" --target RaceServer HoverNetRaceServerClientSmoke HoverNetRaceServerLifecycleSmoke --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        ctest --test-dir "$TEST_BUILD_DIR" --output-on-failure -R 'HoverNetRaceServer(ClientSmoke|ProtocolStrictSmoke|LifecycleSmoke|ProtocolFuzz)'
      ) 8>"${TEST_BUILD_DIR}.lock"
      wait "$GPP_PID"
      test -x build/raceserver/RaceServer
  artifacts:
    expire_in: 7 days
    paths:
      - build/raceserver/RaceServer

build:authserver:linux:
  stage: build
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  needs: []
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - |
      # The CMake tree is kept on the runner between pipelines, so only changed sources recompile; a configure failure discards it and starts clean.
      AUTH_BUILD_DIR="${HOME}/.cache/hovernet-build/authserver"
      mkdir -p "$AUTH_BUILD_DIR" build/authserver
      (
        flock -x 8
        if ! cmake -S . -B "$AUTH_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release; then
          rm -rf "$AUTH_BUILD_DIR"; mkdir -p "$AUTH_BUILD_DIR"
          cmake -S . -B "$AUTH_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release
        fi
        cmake --build "$AUTH_BUILD_DIR" --target HoverNetAuthServer HoverNetModTool HoverNetReplay HoverNetLobbyTest HoverNetProtocolTest --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        ctest --test-dir "$AUTH_BUILD_DIR" --output-on-failure -R 'HoverNet(Lobby|Protocol)$'
        cp "$AUTH_BUILD_DIR/HoverNetAuthServer" "$AUTH_BUILD_DIR/HoverNetModTool" "$AUTH_BUILD_DIR/HoverNetReplay" build/authserver/
      ) 8>"${AUTH_BUILD_DIR}.lock"
  artifacts:
    expire_in: 7 days
    paths:
      - build/authserver/HoverNetAuthServer
      - build/authserver/HoverNetModTool
      - build/authserver/HoverNetReplay

# The Emscripten toolchain, found or installed once per runner (shared by the web build and the web test jobs).
.web_emsdk:
  script:
    - |
      EMSDK_BOOTSTRAP=0
      if [ -z "${EMSDK:-}" ]; then
        EMSDK="${HOME}/.cache/emsdk/${WEB_EMSDK_VERSION}"
        export EMSDK
        EMSDK_BOOTSTRAP=1
      fi
      EMSDK_MARKER="$EMSDK/.hovernet-installed-${WEB_EMSDK_VERSION}"
      if [ ! -x "$EMSDK/upstream/emscripten/emcmake" ] || { [ "$EMSDK_BOOTSTRAP" -eq 1 ] && [ ! -f "$EMSDK_MARKER" ]; }; then
        if [ "$EMSDK_BOOTSTRAP" -ne 1 ]; then
          echo "Configured EMSDK does not contain emcmake: $EMSDK" >&2
          exit 1
        fi
        mkdir -p "$(dirname "$EMSDK")"
        (
          flock -x 9
          if [ ! -x "$EMSDK/upstream/emscripten/emcmake" ] || [ ! -f "$EMSDK_MARKER" ]; then
            INSTALLING="${EMSDK}.installing"
            rm -rf "$INSTALLING" "$EMSDK"
            git clone --depth 1 --branch "$WEB_EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$INSTALLING"
            mv "$INSTALLING" "$EMSDK"
            "$EMSDK/emsdk" install "$WEB_EMSDK_VERSION"
            "$EMSDK/emsdk" activate "$WEB_EMSDK_VERSION"
            touch "$EMSDK_MARKER"
          fi
        ) 9>"${EMSDK}.install.lock"
      fi
      . "$EMSDK/emsdk_env.sh"
      command -v emcc
      emcc --version | grep -F "$WEB_EMSDK_VERSION"

# The page: build, package and (on the default branch) deploy. Only the game is built here, so this job is just the compile and the link; the test programs and their suites are
# built and run by test:web:suites, in a tree of their own and side by side with this job, so the deploy no longer waits for them.
build:game:web:
  stage: web
  needs: []
  tags: ["$WEB_RUNNER_TAG"]
  script:
    - !reference [.web_emsdk, script]
    # Incremental build: keep the CMake tree on the runner between pipelines so only changed sources recompile. The lock serialises pipelines sharing the tree; a
    # configure failure (moved checkout, changed toolchain) discards it and starts clean.
    - |
      WEB_BUILD_DIR="${HOME}/.cache/hovernet-web-build"
      mkdir -p "$WEB_BUILD_DIR"
      (
        flock -x 8
        if ! emcmake cmake -S . -B "$WEB_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DHOVERNET_WEB_DEFERRED_MUSIC="${HOVERNET_WEB_DEFERRED_MUSIC:-OFF}"; then
          rm -rf "$WEB_BUILD_DIR"; mkdir -p "$WEB_BUILD_DIR"
          emcmake cmake -S . -B "$WEB_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DHOVERNET_WEB_DEFERRED_MUSIC="${HOVERNET_WEB_DEFERRED_MUSIC:-OFF}"
        fi
        cmake --build "$WEB_BUILD_DIR" --target HoverNetGame2Player --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        mkdir -p dist/web
        cp "$WEB_BUILD_DIR/HoverNet.html" dist/web/index.html
        HN_MUSIC=0; [ "${HOVERNET_WEB_DEFERRED_MUSIC:-OFF}" = "ON" ] && HN_MUSIC=1
        sed -i "s/__HN_BUILD__/${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}/; s/__HN_ORDER__/$(git log -1 --format=%ct)/; s/__HN_MUSIC__/${HN_MUSIC}/" dist/web/index.html   # the page checks the id against the server (packaging/web/shell.html); hovernet-web-deploy refuses a build whose commit time is older than the live one
        cp "$WEB_BUILD_DIR/HoverNet.js" "$WEB_BUILD_DIR/HoverNet.wasm" "$WEB_BUILD_DIR/HoverNet.data" dist/web/
        # Music after start (docs/operators.md): only when the CI variable HOVERNET_WEB_DEFERRED_MUSIC=ON is set, and only once the
        # host's hovernet-web-deploy accepts HoverNetMusic.bin (re-run packaging/web/setup-host.sh); a host with the old script rejects the archive.
        if [ "${HOVERNET_WEB_DEFERRED_MUSIC:-OFF}" = "ON" ]; then python3 scripts/pack-web-music.py dist/web/HoverNetMusic.bin; fi
      ) 8>"${WEB_BUILD_DIR}.lock"
    - tar -czf "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" -C dist/web index.html HoverNet.js HoverNet.wasm HoverNet.data $( [ -f dist/web/HoverNetMusic.bin ] && echo HoverNetMusic.bin )
    - 'if [ "$CI_COMMIT_BRANCH" = "$HOVERNET_MAIN_BRANCH" ]; then sudo /usr/local/sbin/hovernet-web-deploy "dist/hovernet-web-${CI_COMMIT_SHORT_SHA}.tar.gz"; fi'
  artifacts:
    name: "hovernet-web-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/hovernet-web-*.tar.gz
  rules:
    - !reference [.no_schedule, rules]
    # Docs-only changes cannot alter the web artifact, so skip the rebuild.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &web_inputs
        - NetTarget/**/*
        - packaging/web/**/*
        - CMakeLists.txt
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $HOVERNET_MAIN_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

# The WebAssembly test programs and their suites, in a CMake tree of their own (so they never hold up the page's build or a later pipeline's) and at the same time as build:game:web.
# They are not a gate on the deploy: a failure here fails the pipeline (red) but the page is already out; GitHub Actions runs the same suites before a release.
test:web:suites:
  stage: web
  needs: []
  tags: ["$WEB_RUNNER_TAG"]
  script:
    - !reference [.web_emsdk, script]
    - |
      WEB_TEST_DIR="${HOME}/.cache/hovernet-web-tests"
      mkdir -p "$WEB_TEST_DIR"
      (
        flock -x 8
        if ! emcmake cmake -S . -B "$WEB_TEST_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF; then
          rm -rf "$WEB_TEST_DIR"; mkdir -p "$WEB_TEST_DIR"
          emcmake cmake -S . -B "$WEB_TEST_DIR" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
        fi
        cmake --build "$WEB_TEST_DIR" --target HoverNetDeterminismRun HoverNetRenderGolden HoverNetReplay HoverNetSnapshotTest HoverNetFrameRateTest HoverNetAuthorityTest HoverNetProtocolTest HoverNetPredictionTest HoverNetLobbyTest HoverNetModerationTest HoverNetCryptoTest --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
        SUITE_PIDS=""
        suite() { name="$1"; shift; ( "$@" ) > "$WEB_TEST_DIR/suite-$name.log" 2>&1 & SUITE_PIDS="$SUITE_PIDS $!:$name"; }
        # Cross-platform determinism: the WebAssembly build must replay the scripted races to the same hashes as the committed (native) golden values (docs/determinism.md).
        suite determinism scripts/test-determinism.sh "node $WEB_TEST_DIR/HoverNetDeterminismRun.js"
        suite physics scripts/test-physics.sh "node $WEB_TEST_DIR/HoverNetDeterminismRun.js"
        # The renderer too: it must draw the fixed scenes to the committed hashes (docs/render-golden.md).
        suite render scripts/test-render-golden.sh "node $WEB_TEST_DIR/HoverNetRenderGolden.js"
        # The replay, snapshot, authority, protocol and prediction suites on WebAssembly too: a replay or a snapshot made on any platform must mean the same race in the
        # browser (docs/determinism.md, docs/authoritative-race.md).
        suite replay scripts/test-replay.sh "node $WEB_TEST_DIR/HoverNetReplay.js"
        suite snapshot scripts/test-snapshot.sh "node $WEB_TEST_DIR/HoverNetSnapshotTest.js"
        suite framerate node "$WEB_TEST_DIR/HoverNetFrameRateTest.js" ClassicH 1500
        suite authority node "$WEB_TEST_DIR/HoverNetAuthorityTest.js" ClassicH 8
        suite protocol node "$WEB_TEST_DIR/HoverNetProtocolTest.js" ClassicH 8
        suite lobby node "$WEB_TEST_DIR/HoverNetLobbyTest.js"
        suite moderation node "$WEB_TEST_DIR/HoverNetModerationTest.js"
        suite crypto node "$WEB_TEST_DIR/HoverNetCryptoTest.js"
        suite prediction node "$WEB_TEST_DIR/HoverNetPredictionTest.js" ClassicH 8 60
        SUITES_FAILED=0
        for entry in $SUITE_PIDS; do
          pid="${entry%%:*}"; name="${entry#*:}"
          if wait "$pid"; then echo "ok   web suite: $name"; else echo "FAIL web suite: $name"; SUITES_FAILED=1; fi
          cat "$WEB_TEST_DIR/suite-$name.log"
        done
        [ "$SUITES_FAILED" = "0" ] || exit 1
      ) 8>"${WEB_TEST_DIR}.lock"
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *web_inputs
    - if: '$CI_COMMIT_BRANCH == $HOVERNET_MAIN_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

test:web:smoke:
  stage: package
  needs:
    - job: build:game:web
      artifacts: true
    - job: build:authserver:linux
      artifacts: true
  tags: ["$WEB_RUNNER_TAG"]
  # Drives the built client in headless Chrome (menus, a local race, pause and resume, and a race on a HoverNet 3.0 server over WebSocket). Skips itself
  # when the runner has no Chrome, and never blocks the deploy.
  script:
    - mkdir -p dist/web-unpacked dist/web-smoke
    - tar -xzf "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz" -C dist/web-unpacked
    # Exit 77 means "no Chrome on this runner": pass with a note instead of failing (the shell executor turns any
    # non-zero exit into a job failure). Any other non-zero exit is a real failure.
    - scripts/test-web-client.sh dist/web-unpacked dist/web-smoke "$PWD/build/authserver/HoverNetAuthServer" || rc=$?; if [ "${rc:-0}" = "77" ]; then echo "web smoke test skipped (no Chrome on this runner)"; elif [ "${rc:-0}" != "0" ]; then exit "$rc"; fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/web-smoke/
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *web_inputs
    - if: '$CI_COMMIT_BRANCH == $HOVERNET_MAIN_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

check:web:deployed:
  stage: deploy
  needs:
    # Tags deploy in their own job; on the default branch the web build job deploys itself.
    - job: deploy:web
      optional: true
    - job: build:game:web
      optional: true
  tags: ["$SERVER_RUNNER_TAG"]
  # Post-deploy checks against the Apache on the runner host (the runner cannot reach the public name):
  # headers, MIME types, WebSocket gateway.
  script:
    - HOVERNET_CHECK_LOCAL=1 scripts/check-web-deploy.sh https://hovernet.outiva.com
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_BRANCH == $HOVERNET_MAIN_BRANCH'
      changes: *web_inputs
    - if: '$CI_COMMIT_TAG'

package:raceserver:deb:
  stage: package
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - job: build:raceserver:linux
      artifacts: true
  script:
    - chmod +x packaging/debian/build-raceserver-deb.sh
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; packaging/debian/build-raceserver-deb.sh "${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}" build/raceserver/RaceServer
  artifacts:
    name: "hovernet-raceserver-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*.deb

package:server:deb:
  stage: package
  rules:
    - !reference [.no_schedule, rules]
    - when: on_success
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - job: build:authserver:linux
      artifacts: true
  # Installed on the race-server host by deploy:server (below) on a tag; see docs/operators.md.
  script:
    - chmod +x packaging/debian/build-authserver-deb.sh
    - export PACKAGE_VERSION="${CI_COMMIT_TAG#v}"; packaging/debian/build-authserver-deb.sh "${PACKAGE_VERSION:-0.0.0+${CI_COMMIT_SHORT_SHA}}" build/authserver
  artifacts:
    name: "hovernet-server-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - dist/*.deb

deploy:raceserver:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package:raceserver:deb
      artifacts: true
  resource_group: production-race-server
  environment:
    name: production
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-deploy dist/hovernet-raceserver_*.deb
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

# The HoverNet 3.0 server is deployed automatically from a tag's pipeline, after its package job, like the race server: the job installs the
# package on the race-server host through a root-owned wrapper (packaging/server/install-deploy-helper.sh installs it, once). A fresh install
# is enabled but NOT started (the owner reviews /etc/hovernet/server.conf and starts it once); an upgrade drains a running server first, so
# races under way finish. See docs/operators.md, "Deploying from GitLab".
deploy:server:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: package:server:deb
      artifacts: true
  resource_group: production-hovernet-server
  environment:
    name: production-server
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-server-deploy dist/hovernet-server_*_amd64.deb
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

# The package restarts a running server by itself (queued, because a restart drains races under way). This job then waits for the new process and
# FAILS the pipeline if the old build is still running or the package was left half installed, so a silent non-restart cannot go unnoticed again
# (scripts/verify-server-deploy.sh). It runs unprivileged on the race-server host.
verify:server:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: deploy:server
  script:
    - scripts/verify-server-deploy.sh 840
  timeout: 20m
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

deploy:web:
  stage: deploy
  tags: ["$SERVER_RUNNER_TAG"]
  needs:
    - job: build:game:web
      artifacts: true
  resource_group: production-web
  environment:
    name: production-web
    deployment_tier: production
  script:
    - sudo /usr/local/sbin/hovernet-web-deploy "dist/hovernet-web-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.tar.gz"
  rules:
    - !reference [.no_schedule, rules]
    - if: '$CI_COMMIT_TAG'

name: Build and package HoverNet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hovernet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  linux:
    name: Linux game, race server and DEBs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake dpkg-dev libsdl2-dev

      - name: Configure
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux --parallel 2

      - name: Run tests
        run: ctest --test-dir build/linux --output-on-failure

      - name: Set package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="0.0.0+${GITHUB_SHA::8}"
          fi
          echo "PACKAGE_VERSION=${package_version}" >> "$GITHUB_ENV"

      - name: Build Debian packages
        run: |
          chmod +x packaging/debian/build-game-deb.sh packaging/debian/build-raceserver-deb.sh
          packaging/debian/build-game-deb.sh "$PACKAGE_VERSION" build/linux/HoverNetGame2Player build/linux/ObjFac1.so
          packaging/debian/build-raceserver-deb.sh "$PACKAGE_VERSION" build/linux/RaceServer

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: hovernet-linux-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  raceserver-sanitizers:
    name: RaceServer ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libsdl2-dev
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build RaceServer security tests
        run: cmake --build build/sanitize --target RaceServer HoverNetRaceServerClientSmoke HoverNetRaceServerLifecycleSmoke --parallel 2
      - name: Run protocol, lifecycle, and fuzz tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitize --output-on-failure -R 'HoverNetRaceServer(ClientSmoke|ProtocolStrictSmoke|LifecycleSmoke|ProtocolFuzz)'

  windows:
    name: Windows game and setup EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare SDL2 development files
        shell: pwsh
        run: |
          $triplet = "x86-windows"
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install "sdl2:$triplet" "sdl2:x64-windows"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed to install SDL2" }

          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          New-Item -ItemType Directory -Force "C:\SDL2\include", "C:\SDL2\lib\x86" | Out-Null
          Copy-Item "$installed\include\SDL2\*" "C:\SDL2\include" -Recurse -Force
          Copy-Item "$installed\lib\SDL2.lib" "C:\SDL2\lib\x86\SDL2.lib" -Force
          if (Test-Path "$installed\lib\manual-link\SDL2main.lib") {
            Copy-Item "$installed\lib\manual-link\SDL2main.lib" "C:\SDL2\lib\x86\SDL2main.lib" -Force
          }
          Copy-Item "$installed\bin\SDL2.dll" "C:\SDL2\lib\x86\SDL2.dll" -Force

      - name: Build shared x64 SDL2 client
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B build/windows-shared -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "Shared x64 client configure failed" }

          cmake --build build/windows-shared --target HoverNetGame2Player --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Shared x64 client build failed" }

          $required = @(
            "build\windows-shared\Release\HoverNetGame2Player.exe",
            "build\windows-shared\Release\ObjFac1.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing shared x64 runtime files: $($missing -join ', ')" }

      - name: Build Windows client
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          & $msbuild NetTarget/ObjFac1/ObjFac1.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ObjFac1 build failed" }
          & $msbuild NetTarget/Game2/Game2.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Game2 build failed" }

          Copy-Item "C:\SDL2\lib\x86\SDL2.dll" "Release\SDL2.dll" -Force
          Copy-Item "NetTarget\ObjFac1\ObjFac1.dat" "Release\ObjFac1.dat" -Force
          New-Item -ItemType Directory -Force -Path "Release\tracks" | Out-Null
          Copy-Item "NetTarget\Tracks\*.trk" "Release\tracks\" -Force
          $required = @(
            "Release\Game2.exe",
            "Release\ObjFac1.dll",
            "Release\ObjFac1.dat",
            "Release\VideoServices.dll",
            "Release\Model.dll",
            "Release\MainCharacter.dll",
            "Release\SDL2.dll",
            "Release\tracks\ClassicH.trk"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing Windows runtime files: $($missing -join ', ')" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          HOVERNET_REF_TYPE: ${{ github.ref_type }}
          HOVERNET_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:HOVERNET_REF_TYPE -eq "tag") {
            $version = $env:HOVERNET_REF_NAME.TrimStart("v")
          } else {
            $version = "0.0.0-$($env:GITHUB_SHA.Substring(0, 8))"
          }

          $env:HOVERNET_VERSION = $version
          $env:HOVERNET_RELEASE_DIR = (Resolve-Path "Release").Path
          $env:CI_PROJECT_DIR = $env:GITHUB_WORKSPACE
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\HoverNet.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup packaging failed" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hovernet-windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows race server
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          & $msbuild NetTarget/RaceServer/RaceServer.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "RaceServer build failed" }
          if (-not (Test-Path "NetTarget\RaceServer\Release\RaceServer.exe")) { throw "Missing NetTarget\RaceServer\Release\RaceServer.exe" }

          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0+$("${{ github.sha }}".Substring(0, 8))"
          }

          New-Item -ItemType Directory -Force -Path "stage\raceserver" | Out-Null
          Copy-Item "NetTarget\RaceServer\Release\RaceServer.exe" "stage\raceserver\RaceServer.exe" -Force
          Copy-Item "NetTarget\RaceServer\config.xml" "stage\raceserver\config.xml" -Force
          Compress-Archive -Path "stage\raceserver\*" -DestinationPath "hovernet-raceserver_${version}_win32.zip" -Force

      - name: Upload Windows race server
        uses: actions/upload-artifact@v4
        with:
          name: hovernet-windows-raceserver
          path: hovernet-raceserver_*_win32.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag

name: Build and package HoverNet

on:
  push:
    # The community-tracks-N tags only host downloadable track files (see
    # docs/community-tracks.md); they are not builds.
    tags-ignore:
      - 'community-tracks-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hovernet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency security review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  linux:
    name: Linux game, race server and DEBs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject tracked build artifacts
        shell: bash
        run: |
          tracked_artifacts=$(git ls-files | grep -Ei "(^|/)(Debug|Release|build|dist)(/|$)|\\.(exe|dll|obj|pdb|ilk|lib|exp|iobj|ipdb|pch|res|tlog|lastbuildstate|recipe|deb|zip|msi)$" || true)
          if [[ -n "$tracked_artifacts" ]]; then
            echo "Generated build artifacts are tracked:"
            echo "$tracked_artifacts"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake dpkg-dev libsdl2-dev

      - name: Configure
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux --parallel 2

      - name: Run tests
        run: ctest --test-dir build/linux --output-on-failure

      - name: Set package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          else
            package_version="0.0.0+${GITHUB_SHA::8}"
          fi
          echo "PACKAGE_VERSION=${package_version}" >> "$GITHUB_ENV"

      - name: Build Debian packages
        run: |
          chmod +x packaging/debian/build-game-deb.sh packaging/debian/build-raceserver-deb.sh
          packaging/debian/build-game-deb.sh "$PACKAGE_VERSION" build/linux/HoverNetGame2Player build/linux/ObjFac1.so
          packaging/debian/build-raceserver-deb.sh "$PACKAGE_VERSION" build/linux/RaceServer

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: hovernet-linux-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  raceserver-sanitizers:
    name: RaceServer ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libsdl2-dev
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build RaceServer security tests
        run: cmake --build build/sanitize --target RaceServer HoverNetRaceServerClientSmoke HoverNetRaceServerLifecycleSmoke --parallel 2
      - name: Run protocol, lifecycle, and fuzz tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitize --output-on-failure -R 'HoverNetRaceServer(ClientSmoke|ProtocolStrictSmoke|LifecycleSmoke|ProtocolFuzz)'

  windows:
    name: Windows game and setup EXE
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare SDL2 development files
        shell: pwsh
        run: |
          $triplet = "x86-windows"
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install "sdl2:$triplet" "sdl2:x64-windows"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed to install SDL2" }

          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\$triplet"
          New-Item -ItemType Directory -Force "C:\SDL2\include", "C:\SDL2\lib\x86" | Out-Null
          Copy-Item "$installed\include\SDL2\*" "C:\SDL2\include" -Recurse -Force
          Copy-Item "$installed\lib\SDL2.lib" "C:\SDL2\lib\x86\SDL2.lib" -Force
          if (Test-Path "$installed\lib\manual-link\SDL2main.lib") {
            Copy-Item "$installed\lib\manual-link\SDL2main.lib" "C:\SDL2\lib\x86\SDL2main.lib" -Force
          }
          Copy-Item "$installed\bin\SDL2.dll" "C:\SDL2\lib\x86\SDL2.dll" -Force

      - name: Build shared x64 SDL2 client
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts\buildsystems\vcpkg.cmake"
          cmake -S . -B build/windows-shared -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "Shared x64 client configure failed" }

          cmake --build build/windows-shared --target HoverNetGame2Player RaceServer --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Shared x64 client or RaceServer build failed" }

          $required = @(
            "build\windows-shared\Release\HoverNet.exe",
            "build\windows-shared\Release\ObjFac1.dll",
            "build\windows-shared\Release\RaceServer.exe"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing shared x64 runtime files: $($missing -join ', ')" }
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\SDL2.dll" `
            "build\windows-shared\Release\SDL2.dll" -Force

      - name: Smoke-test shared x64 SDL2 client
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $client = "build\windows-shared\Release\HoverNet.exe"
          $scenarios = @(
            "--frames 1",
            "--settings-screen --frames 2",
            "--controls-reference --frames 2",
            "--pause-menu --frames 2",
            "--results-screen --frames 2",
            "--onboarding --frames 2"
          )
          foreach ($scenario in $scenarios) {
            $arguments = $scenario.Split(' ')
            $process = Start-Process -FilePath $client -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Shared x64 client smoke scenario failed: $scenario"
            }
          }

          $serverPath = "build\windows-shared\Release\RaceServer.exe"
          $server = Start-Process -FilePath $serverPath `
            -ArgumentList "19879", "build\windows-shared\shared-online-race-smoke.log", "--require-protocol-2" `
            -PassThru
          try {
            Start-Sleep -Seconds 1
            $hostClient = Start-Process -FilePath $client `
              -ArgumentList "--lobby", "127.0.0.1", "19879", "--online-race-host-smoke", "--frames", "300" `
              -PassThru
            Start-Sleep -Seconds 1
            $joinClient = Start-Process -FilePath $client `
              -ArgumentList "--lobby", "127.0.0.1", "19879", "--online-race-join-smoke", "--frames", "300" `
              -Wait -PassThru
            $hostClient.WaitForExit()
            if ($hostClient.ExitCode -ne 0 -or $joinClient.ExitCode -ne 0) {
              throw "Shared x64 two-client online race acceptance failed"
            }
          }
          finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Build Windows client
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          & $msbuild NetTarget/ObjFac1/ObjFac1.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ObjFac1 build failed" }
          & $msbuild NetTarget/Game2/Game2.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Game2 build failed" }

          Copy-Item "C:\SDL2\lib\x86\SDL2.dll" "Release\SDL2.dll" -Force
          Copy-Item "NetTarget\ObjFac1\ObjFac1.dat" "Release\ObjFac1.dat" -Force
          New-Item -ItemType Directory -Force -Path "Release\tracks" | Out-Null
          Copy-Item "NetTarget\Tracks\*.trk" "Release\tracks\" -Force
          $required = @(
            "Release\Game2.exe",
            "Release\ObjFac1.dll",
            "Release\ObjFac1.dat",
            "Release\VideoServices.dll",
            "Release\Model.dll",
            "Release\MainCharacter.dll",
            "Release\SDL2.dll",
            "Release\tracks\ClassicH.trk"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing Windows runtime files: $($missing -join ', ')" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }

      - name: Build Windows installer
        shell: pwsh
        env:
          HOVERNET_REF_TYPE: ${{ github.ref_type }}
          HOVERNET_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:HOVERNET_REF_TYPE -eq "tag") {
            $version = $env:HOVERNET_REF_NAME.TrimStart("v")
          } else {
            $version = "0.0.0-$($env:GITHUB_SHA.Substring(0, 8))"
          }

          $env:HOVERNET_VERSION = $version
          $env:HOVERNET_RELEASE_DIR = (Resolve-Path "Release").Path
          $env:CI_PROJECT_DIR = $env:GITHUB_WORKSPACE
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\HoverNet.iss"
          if ($LASTEXITCODE -ne 0) { throw "Legacy Inno Setup packaging failed" }

          $x64Release = "build\windows-shared\Release"
          $vcRedist = Join-Path $x64Release "vc_redist.x64.exe"
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $vcRedist
          $vcSignature = Get-AuthenticodeSignature $vcRedist
          if ($vcSignature.Status -ne "Valid" -or $vcSignature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "Downloaded Visual C++ x64 Redistributable does not have a valid Microsoft signature"
          }
          New-Item -ItemType Directory -Force `
            "$x64Release\NetTarget\Tracks", `
            "$x64Release\NetTarget\LinuxClient\assets" | Out-Null
          Copy-Item "NetTarget\ObjFac1.dat" "$x64Release\NetTarget\ObjFac1.dat" -Force
          Copy-Item "NetTarget\Tracks\*.trk" "$x64Release\NetTarget\Tracks\" -Force
          Copy-Item "NetTarget\CommunityTracks.tsv" "$x64Release\NetTarget\CommunityTracks.tsv" -Force
          Copy-Item "NetTarget\LinuxClient\assets\menu-hovercraft.bmp" `
            "$x64Release\NetTarget\LinuxClient\assets\menu-hovercraft.bmp" -Force
          & "scripts\validate-windows-x64-package.ps1" -ReleaseDir $x64Release -RequireVCRedist
          $env:HOVERNET_X64_RELEASE_DIR = (Resolve-Path $x64Release).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\HoverNet-x64.iss"
          if ($LASTEXITCODE -ne 0) { throw "Shared x64 Inno Setup packaging failed" }

          $installer = Get-ChildItem "dist\*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Shared x64 installer was not generated" }
          $installDir = Join-Path $env:RUNNER_TEMP "HoverNet-x64-install-smoke"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir")
          $install = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Shared x64 installer smoke failed with exit code $($install.ExitCode)" }
          try {
            & "scripts\validate-windows-x64-package.ps1" -ReleaseDir $installDir
            $env:SDL_VIDEODRIVER = "dummy"
            $env:SDL_AUDIODRIVER = "dummy"
            $sourceData = "NetTarget\ObjFac1.dat"
            $hiddenSourceData = "$sourceData.package-smoke-hidden"
            Move-Item $sourceData $hiddenSourceData
            try {
              $installedScenarios = @(
                "--frames 1",
                "--settings-screen --frames 2",
                "--controls-reference --frames 2",
                "--pause-menu --frames 2",
                "--results-screen --frames 2",
                "--onboarding --frames 2"
              )
              foreach ($scenario in $installedScenarios) {
                $installedClient = Start-Process -FilePath "$installDir\HoverNet.exe" `
                  -WorkingDirectory $installDir -ArgumentList ($scenario.Split(" ")) -Wait -PassThru
                if ($installedClient.ExitCode -ne 0) {
                  throw "Installed shared x64 client smoke failed: $scenario"
                }
              }

              # Local race on every bundled track plus the community-track download
              # path (curl.exe, gzip, SHA-256, atomic install) against a local server.
              & "scripts\test-windows-client.ps1" -Exe "$installDir\HoverNet.exe" -DataDir $installDir
              if ($LASTEXITCODE -ne 0) { throw "Installed shared x64 client acceptance failed" }

              $installedServer = Start-Process -FilePath "$x64Release\RaceServer.exe" `
                -ArgumentList "19881", "$x64Release\installed-online-race-smoke.log", "--require-protocol-2" `
                -PassThru
              try {
                Start-Sleep -Seconds 1
                $installedHost = Start-Process -FilePath "$installDir\HoverNet.exe" `
                  -WorkingDirectory $installDir `
                  -ArgumentList "--lobby", "127.0.0.1", "19881", "--online-race-host-smoke", "--frames", "300" `
                  -PassThru
                Start-Sleep -Seconds 1
                $installedJoiner = Start-Process -FilePath "$installDir\HoverNet.exe" `
                  -WorkingDirectory $installDir `
                  -ArgumentList "--lobby", "127.0.0.1", "19881", "--online-race-join-smoke", "--frames", "300" `
                  -Wait -PassThru
                $installedHost.WaitForExit()
                if ($installedHost.ExitCode -ne 0 -or $installedJoiner.ExitCode -ne 0) {
                  throw "Installed shared x64 two-client online race acceptance failed"
                }
              }
              finally {
                if (-not $installedServer.HasExited) { Stop-Process -Id $installedServer.Id -Force }
              }
            }
            finally {
              Move-Item $hiddenSourceData $sourceData
            }
          }
          finally {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) {
              Start-Process -FilePath $uninstaller `
                -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: hovernet-windows-installers
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows race server
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found" }

          & $msbuild NetTarget/RaceServer/RaceServer.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "RaceServer build failed" }
          if (-not (Test-Path "NetTarget\RaceServer\Release\RaceServer.exe")) { throw "Missing NetTarget\RaceServer\Release\RaceServer.exe" }

          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0+$("${{ github.sha }}".Substring(0, 8))"
          }

          New-Item -ItemType Directory -Force -Path "stage\raceserver" | Out-Null
          Copy-Item "NetTarget\RaceServer\Release\RaceServer.exe" "stage\raceserver\RaceServer.exe" -Force
          Copy-Item "NetTarget\RaceServer\config.xml" "stage\raceserver\config.xml" -Force
          Copy-Item "NetTarget\CommunityTracks.tsv" "stage\raceserver\CommunityTracks.tsv" -Force
          Compress-Archive -Path "stage\raceserver\*" -DestinationPath "hovernet-raceserver_${version}_win32.zip" -Force

      - name: Upload Windows race server
        uses: actions/upload-artifact@v4
        with:
          name: hovernet-windows-raceserver
          path: hovernet-raceserver_*_win32.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write SHA256SUMS
        run: scripts/make-release-checksums.sh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A tag with a hyphen (v2.0.0-beta.1) is a pre-release: it is marked as one
          # (so it never becomes "latest") and starts with the beta notes.
          args=(--generate-notes --verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --notes-file docs/beta-release-notes.md)
          else
            # A stable release starts with its notes, including the invitation to keep
            # opening GitHub issues with feedback.
            args+=(--notes-file docs/release-notes.md)
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
